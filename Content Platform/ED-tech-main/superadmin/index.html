      z-index: -2;

    .bg-gradient {

      background: linear-gradient(180deg, rgba(6, 10, 20, 0.55) 0%, rgba(6, 10, 20, 0.95) 100%);
      z-index: -1;

    .portal-sidebar {

      border-right: 1px solid rgba(0, 240, 255, 0.15);

      flex-direction: column;
      padding: 24px 16px;
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 100;
      overflow-y: auto;
    }

    .brand-logo {

      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding: 0 8px;
    }

    .brand-title {
      font-size: 1.25rem;

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .profile-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
      padding: 14px 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .avatar-wrapper {
      position: relative;
      margin-bottom: 6px;
    }

    .avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 2px solid rgba(0, 240, 255, 0.5);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
      object-fit: cover;
    }

    .status-dot {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 12px;
      height: 12px;
      background-color: #10B981;
      border: 2px solid #0A0F1D;
      border-radius: 50%;
    }

    .profile-name {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      margin: 0;
    }

    .profile-role {
      font-size: 11px;
      color: #00F0FF;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 2px 10px;
      border-radius: 12px;
      margin-top: 4px;
    }

    .glass-panel {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      border-radius: 20px;
    }

    .nav-link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 16px;
      color: #94A3B8;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
    }

    .nav-link-btn:hover {
      background: rgba(0, 240, 255, 0.08);
      color: #00F0FF;
      border-color: rgba(0, 240, 255, 0.2);
      transform: translateX(4px);
    }

    .nav-link-btn.active {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.18), rgba(59, 130, 246, 0.18));

      border: 1px solid rgba(0, 240, 255, 0.4);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.18);

    ::-webkit-scrollbar-thumb:hover { background: rgba(0, 240, 255, 0.6); }

</head>

            code: logData.code || 200,
            title: logData.title,
            details: logData.details || '',

            metadata: logData.metadata || {}

            headers: {
              'apikey': SUPABASE_CONFIG.key,
              'Authorization': `Bearer ${SUPABASE_CONFIG.key}`,
              'Content-Type': 'application/json',
              'Prefer': 'return=representation'
            },
            body: JSON.stringify(payload)
          });

          } else {
            fetchLiveAuditLogs();

              'Content-Type': 'application/json'

        const updated = currentList.filter(s => s.toLowerCase() !== subjectToRemove.toLowerCase()).join(', ');
        handleUpdateSubjects(classId, updated);
      };

      // Add or update teacher in a class with specific subject
      const handleAddTeacherToClass = (classId, teacherEmail, subject, isClassTeacher = false) => {
        if (!teacherEmail || !subject.trim()) return;
        setClasses(prev => prev.map(c => {
          if (c.id === classId) {
            const current = c.teachers || [];
            const idx = current.findIndex(t => t.email === teacherEmail);
            let updated;
            if (idx >= 0) {
              updated = [...current];
              updated[idx] = { email: teacherEmail, subject, isClassTeacher: isClassTeacher || updated[idx].isClassTeacher };
            } else {
              updated = [...current, { email: teacherEmail, subject, isClassTeacher }];
            }
            return { ...c, teachers: updated };
          }
          return c;
        }));
      };

      // Remove teacher from a class
      const handleRemoveTeacherFromClass = (classId, teacherEmail) => {
        setClasses(prev => prev.map(c => {
          if (c.id === classId) {
            return { ...c, teachers: (c.teachers || []).filter(t => t.email !== teacherEmail) };
          }
          return c;
        }));
      };

      const handleToggleStudentClass = (classId, studentEmail) => {
        setClasses(prev => prev.map(c => {
          if (c.id === classId) {
            const current = c.studentEmails || [];
            const exists = current.includes(studentEmail);
            const studentEmails = exists ? current.filter(e => e !== studentEmail) : [...current, studentEmail];
            return { ...c, studentEmails };
          }
          return c;
        }));
      };

      const filtered = orgs.filter(o =>
        o.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
        (o.domain || '').toLowerCase().includes(searchTerm.toLowerCase())

      const handleOnboard = (e) => {
        e.preventDefault();
        const roleLabel = onboardForm.role === 'STUDENT' ? 'Student' : onboardForm.role === 'TEACHER' ? 'Teacher' : 'Admin';
        const classNote = onboardForm.className ? ` into ${onboardForm.className}` : '';
        setOnboardSuccess(`✅ ${roleLabel} "${onboardForm.name}" (${onboardForm.email}) onboarded to ${selectedSchool.name}${classNote}. Invite email sent.`);
        setOnboardForm({ name: '', email: '', role: 'STUDENT', className: '' });
        setTimeout(() => setOnboardSuccess(''), 5000);
      };

      const parseFileText = (text, fileName) => {
        setCsvError('');
        setCsvParsed([]);
        try {
          const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
          if (lines.length === 0) throw new Error('Selected file is empty.');

          let startIndex = 0;
          const firstLineLower = lines[0].toLowerCase();
          if (firstLineLower.includes('name') && (firstLineLower.includes('email') || firstLineLower.includes('role') || firstLineLower.includes('class'))) {
            startIndex = 1; // Skip header row
          }

          const dataLines = lines.slice(startIndex);
          if (dataLines.length === 0) throw new Error('No member data rows found below the header.');

          const parsed = dataLines.map((line, i) => {
            const parts = line.split(',').map(p => p.trim().replace(/^["']|["']$/g, ''));
            if (parts.length < 3) throw new Error(`Row ${i + 1 + startIndex}: Missing required columns (Name, Email, Role)`);
            const role = parts[2].toUpperCase();
            if (!['STUDENT', 'TEACHER', 'ADMIN'].includes(role)) {
              throw new Error(`Row ${i + 1 + startIndex}: Invalid role "${parts[2]}". Must be STUDENT, TEACHER, or ADMIN`);
            }
            return {
              name: parts[0],
              email: parts[1],
              role,
              className: parts[3] || ''
            };
          });
          setCsvParsed(parsed);
        } catch (err) {
          setCsvError(err.message);
        }
      };

      const processSelectedFile = (file) => {
        if (!file) return;
        const validExts = ['.csv', '.txt'];
        const isExtValid = validExts.some(ext => file.name.toLowerCase().endsWith(ext));
        if (!isExtValid) {
          setCsvError('Please upload a valid .csv or .txt file.');
          return;
        }

        setUploadedFile({
          name: file.name,
          size: (file.size / 1024).toFixed(1) + ' KB'
        });

        const reader = new FileReader();
        reader.onload = (e) => {
          parseFileText(e.target.result, file.name);
        };
        reader.onerror = () => {
          setCsvError('Failed to read file from disk. Please try again.');
        };
        reader.readAsText(file);
      };

      const handleFileInputChange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) processSelectedFile(file);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });

        const a = document.createElement('a');

                  <th className="p-4">Category</th>
                  <th className="p-4">Time</th>
                  <th className="p-4 text-right">Status</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-800">
                {filteredLogs.length === 0 ? (
                  <tr>
                    <td colSpan="6" className="p-8 text-center text-slate-500 text-xs">
                      No audit records found matching criteria.
                    </td>
                  </tr>
                ) : (
                  filteredLogs.map(log => (
                    <tr key={log.id} className="hover:bg-slate-800/30">
                      <td className="p-4">
                        <span className={`px-2 py-0.5 rounded font-bold text-[10px] ${
                          log.severity === 'CRITICAL' || log.severity === 'ERROR' ? 'bg-red-500/20 text-red-400 border border-red-500/40' :
                          log.severity === 'WARNING' || log.severity === 'SECURITY' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/40' :
                          'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40'
                        }`}>
                          {log.severity || 'INFO'}
                        </span>
                      </td>
                      <td className="p-4">
                        <p className="text-white font-sans font-semibold">{log.title}</p>
                        <p className="text-slate-500 text-[10px] font-mono mt-0.5">{log.source} {log.details ? `• ${log.details}` : ''}</p>
                      </td>
                      <td className="p-4 font-bold text-cyan-300">{log.actor_email || 'System Engine'}</td>
                      <td className="p-4 text-purple-300">{log.category || 'SYSTEM'}</td>
                      <td className="p-4 text-slate-400">{(log.created_at || '').slice(0, 19).replace('T', ' ') || 'Just now'}</td>
                      <td className="p-4 text-right">
                        {log.status === 'ACTIVE' ? (
                          <button
                            onClick={() => onResolveIncident(log.id)}
                            className="px-2.5 py-1 rounded bg-red-500/20 hover:bg-emerald-500/20 text-red-400 hover:text-emerald-400 border border-red-500/40 hover:border-emerald-500/40 text-[10px] font-bold transition">
                            Active (Resolve →)
                          </button>
                        ) : (
                          <span className="px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 text-[10px] font-bold">RESOLVED</span>
                        )}
                      </td>
                    </tr>
                  ))
                )}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ── VIEW 7: FLAGS ──
    function FeatureFlagsView({ flags, setFlags }) {
      const toggle = (key) => setFlags(prev => ({ ...prev, [key]: !prev[key] }));
      return (
        <div className="grid grid-cols-2 gap-4">
          <FlagCard title="WebGL Physics Engine v2" desc="Enables GPU-accelerated raymarching for 3D optics labs." active={flags.webglPhysicsV2} onToggle={() => toggle('webglPhysicsV2')} />
          <FlagCard title="AI Science Tutor Chatbot" desc="Injects instant AI diagnostic assistance into student labs." active={flags.aiTutorChatbot} onToggle={() => toggle('aiTutorChatbot')} />
          <FlagCard title="R2 Dynamic Asset Streaming" desc="Streams GLB models directly from Cloudflare R2 edge." active={flags.r2StreamingOptimized} onToggle={() => toggle('r2StreamingOptimized')} />
          <FlagCard title="Maintenance Mode Splash" desc="Blocks non-SuperAdmin access with maintenance message." active={flags.maintenanceSplash} onToggle={() => toggle('maintenanceSplash')} danger />
        </div>
      );
    }

    function StatBox({ label, value, icon, color }) {
      return (
        <div className="glass-panel p-4 flex items-center justify-between">
          <div>
            <span className="text-xs text-slate-400 font-medium">{label}</span>
            <p className="text-xl font-extrabold text-white mt-1">{value}</p>
          </div>
          <i className={`ph ${icon} text-3xl ${color}`}></i>
        </div>
      );
    }

    function FlagCard({ title, desc, active, onToggle, danger }) {
      return (
        <div className="glass-panel p-5 flex items-center justify-between">
          <div>
            <h4 className="font-bold text-white text-sm flex items-center gap-2">
              {title} {danger && <span className="text-[10px] bg-red-500/20 text-red-400 px-1.5 py-0.5 rounded font-mono">DANGER</span>}
            </h4>
            <p className="text-xs text-slate-400 max-w-sm mt-0.5">{desc}</p>
          </div>
          <button 
            onClick={onToggle}
            className={`w-12 h-6 rounded-full transition-colors relative p-1 ${active ? (danger ? 'bg-red-500' : 'bg-cyan-400') : 'bg-slate-800'}`}
          >
            <div className={`w-4 h-4 rounded-full bg-slate-950 transition-transform ${active ? 'translate-x-6' : 'translate-x-0'}`}></div>
          </button>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<SuperAdminApp />);
  </script>
</body>

</html>
