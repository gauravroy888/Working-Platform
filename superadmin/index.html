    (function () {
      try {
        var raw = localStorage.getItem('edtech_user') || localStorage.getItem('edtech_superadmin_user');
        if (!raw && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
          var devUser = { uid: 'sa_dev_1', name: 'SuperAdmin Dev', email: 'admin@platform.com', role: 'super_admin' };
          localStorage.setItem('edtech_user', JSON.stringify(devUser));
          raw = JSON.stringify(devUser);
        }
        if (!raw) { window.location.replace('/login.html'); return; }
        var u = JSON.parse(raw);
        if (!u || !u.uid) { window.location.replace('/login.html'); return; }
        if (u.role !== 'super_admin' && u.role !== 'superadmin') {
          // Authenticated but not super_admin — redirect to their portal
          window.location.replace('/login.html');
        }
      } catch (e) {
        window.location.replace('/login.html');

    function FullscreenToggle() {
      const [isFullscreen, setIsFullscreen] = useState(!!document.fullscreenElement);

      useEffect(() => {
        const handleFSChange = () => setIsFullscreen(!!document.fullscreenElement);
        document.addEventListener('fullscreenchange', handleFSChange);
        return () => document.removeEventListener('fullscreenchange', handleFSChange);
      }, []);

      const toggleFS = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => console.warn(err));
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
        }
      };

      return (
        <button
          onClick={toggleFS}
          className="px-3.5 py-2 rounded-xl bg-slate-900/80 hover:bg-slate-800 border border-cyan-500/30 text-slate-300 hover:text-white font-semibold text-xs flex items-center gap-2 transition shadow-md"
          title={isFullscreen ? "Exit Fullscreen (Esc)" : "Toggle Fullscreen"}
        >

          <span className="hidden sm:inline">{isFullscreen ? 'Exit Fullscreen' : 'Fullscreen'}</span>
        </button>
      );
    }

      const [impersonatedUser, setImpersonatedUser] = useState(null);
      const [showOrgModal, setShowOrgModal] = useState(false);
      const [showAnnounceModal, setShowAnnounceModal] = useState(false);
      const [showPhotoModal, setShowPhotoModal] = useState(false);
      const [announcementText, setAnnouncementText] = useState("");
      const [announcementSent, setAnnouncementSent] = useState(false);
      const [isLogsLoading, setIsLogsLoading] = useState(false);
      const [featureFlags, setFeatureFlags] = useState({
        webglPhysicsV2: true,
        aiTutorChatbot: true,
        r2StreamingOptimized: true,
        maintenanceSplash: false
      });

      // Asynchronously recover session from Supabase tokens or profiles table
      useEffect(() => {
        const resolveSession = async () => {
          try {
            let user = currentUser;

            // 1. Check local storage token if currentUser is missing or incomplete
            if (!user || !user.email) {
              for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('sb-') && key.endsWith('-auth-token')) {
                  try {
                    const tokenData = JSON.parse(localStorage.getItem(key));
                    if (tokenData && tokenData.user) {
                      user = {
                        uid: tokenData.user.id,
                        email: tokenData.user.email,
                        name: tokenData.user.user_metadata?.full_name || tokenData.user.email?.split('@')[0],
                        avatar_url: tokenData.user.user_metadata?.avatar_url
                      };
                      break;
                    }
                  } catch (e) {}
                }
              }
            }

            // 2. Query Supabase profiles table if we have an email
            if (user && user.email) {
              try {
                const res = await fetch(`${SUPABASE_CONFIG.url}/rest/v1/profiles?email=eq.${encodeURIComponent(user.email.toLowerCase())}`, {

                const profList = await res.json();
                if (Array.isArray(profList) && profList.length > 0) {
                  const p = profList[0];
                  user = {
                    uid: p.auth_id || user.uid,
                    email: p.email,
                    name: p.name || user.name || 'Super Admin',
                    role: p.role,
                    avatar_url: p.avatar_url || user.avatar_url
                  };
                }
              } catch (e) {}

            // 3. Root email auto-grant for urvashinath0409@gmail.com
            const userEmail = (user?.email || '').toLowerCase();
            const isRootEmail = userEmail === 'urvashinath0409@gmail.com';

            if (isRootEmail) {
              user = {
                uid: user?.uid || 'super-admin-root',
                email: 'urvashinath0409@gmail.com',
                name: user?.name || CURRENT_SUPER_ADMIN.name,
                role: 'super_admin',
                avatar_url: user?.avatar_url || CURRENT_SUPER_ADMIN.avatar
              };
            }

            if (user && (user.role === 'super_admin' || user.role === 'superadmin' || isRootEmail)) {
              setCurrentUser(user);
              localStorage.setItem('edtech_user', JSON.stringify(user));
              if (user.avatar_url) localStorage.setItem('portal_avatar', user.avatar_url);
              if (user.name) localStorage.setItem('portal_name', user.name);
            } else if (user) {

            }
          } catch (err) {
            console.error('Session resolution error:', err);
          } finally {
            setAuthChecking(false);
          }
        };

        resolveSession();
      }, []);

      // Fetch live audit logs & incident records from Supabase
      const fetchLiveAuditLogs = async () => {
        try {
          setIsLogsLoading(true);
          const res = await fetch(`${SUPABASE_CONFIG.url}/rest/v1/system_audit_logs?select=*&order=created_at.desc`, {
            headers: { 'apikey': SUPABASE_CONFIG.key, 'Authorization': `Bearer ${SUPABASE_CONFIG.key}` }
          });
          const data = await res.json();
          if (Array.isArray(data)) {
            setAuditLogs(data);
          }
        } catch (e) {
          console.warn("Failed to fetch live audit logs from Supabase:", e);
        } finally {
          setIsLogsLoading(false);
        }
      };

      // Log a platform event/incident to Supabase
      const logPlatformIncident = async (logData) => {
        try {
          const payload = {
            severity: logData.severity || 'INFO',
            category: logData.category || 'SYSTEM',
            code: logData.code || 200,
            title: logData.title,
            details: logData.details || '',
            source: logData.source || 'SuperAdmin Portal',
            actor_email: logData.actor_email || CURRENT_SUPER_ADMIN.email,
            school_id: logData.school_id || 'inst-dps-001',
            status: logData.status || 'ACTIVE',
            metadata: logData.metadata || {}
          };
          const res = await fetch(`${SUPABASE_CONFIG.url}/rest/v1/system_audit_logs`, {
            method: 'POST',
            headers: {
              'apikey': SUPABASE_CONFIG.key,
              'Authorization': `Bearer ${SUPABASE_CONFIG.key}`,
              'Content-Type': 'application/json',
              'Prefer': 'return=representation'
            },
            body: JSON.stringify(payload)
          });
          const inserted = await res.json();
          if (Array.isArray(inserted) && inserted.length > 0) {
            setAuditLogs(prev => [inserted[0], ...prev]);
          } else {
            fetchLiveAuditLogs();
          }
        } catch (e) {
          console.error("Failed to insert platform incident:", e);
        }

      // Resolve a specific incident in Supabase

        try {
          await fetch(`${SUPABASE_CONFIG.url}/rest/v1/system_audit_logs?id=eq.${id}`, {

              'Authorization': `Bearer ${SUPABASE_CONFIG.key}`,
              'Content-Type': 'application/json'

                <div className="flex gap-3 pt-3">

                  <button type="submit" className="flex-1 py-2.5 rounded-xl bg-cyan-400 text-slate-950 font-bold hover:bg-cyan-300 text-xs">Create Workspace</button>

          {/* Broadcast Alert Modal */}
          {showAnnounceModal && (

                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-lg font-bold text-white flex items-center gap-2"><i className="ph ph-megaphone text-purple-400"></i> Platform Global Broadcast</h3>
                  <button type="button" onClick={() => setShowAnnounceModal(false)} className="text-slate-400 hover:text-white"><i className="ph ph-x text-xl"></i></button>
                </div>

                {announcementSent ? (
                  <div className="p-6 text-center text-emerald-400 font-bold text-sm">
                    ✅ Broadcast Banner Pushed Live across Platform!
                  </div>
                ) : (
                  <>
                    <div className="space-y-3 text-xs">
                      <div>
                        <label className="block text-slate-300 font-semibold mb-1">Target Audience</label>
                        <select className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white">
                          <option value="all">Every Single User (Students, Teachers, Admins)</option>
                          <option value="teachers">Teachers Only</option>
                          <option value="students">Students Only</option>

                      <div>
                        <label className="block text-slate-300 font-semibold mb-1">Broadcast Message</label>
                        <textarea

                        ></textarea>

                      <button type="submit" className="flex-1 py-2.5 rounded-xl bg-purple-600 text-white font-bold hover:bg-purple-500 text-xs">Broadcast Alert Now</button>

          {/* ── PROFILE PHOTO / AVATAR MODAL ── */}

    }

    function SidebarButton({ icon, label, id, active, onClick }) {
      const isActive = active === id;
      return (
        <button 
          onClick={() => onClick(id)}
          className={`nav-link-btn ${isActive ? 'active' : ''}`}
        >
          <i className={`ph ${icon} text-lg ${isActive ? 'text-cyan-400' : 'text-slate-400'}`}></i>
          <span>{label}</span>
        </button>
      );
    }

    // ── SUPERADMIN PROFILE PHOTO & AVATAR MODAL COMPONENT ──
    function SuperAdminProfilePhotoModal({ currentUser, setCurrentUser, onClose }) {
      const [activeTab, setActiveTab] = React.useState('avatar');
      const [gender, setGender] = React.useState('female');
      const [expression, setExpression] = React.useState('happy');
      const [hair, setHair] = React.useState('longButNotTooLong');
      const [hairColor, setHairColor] = React.useState('2c1b18');
      const [facialHair, setFacialHair] = React.useState('');
      const [facialHairColor, setFacialHairColor] = React.useState('2c1b18');
      const [skinColor, setSkinColor] = React.useState('ffdbb4');
      const [accessories, setAccessories] = React.useState('');
      const [clothing, setClothing] = React.useState('blazerAndShirt');
      const [clothingColor, setClothingColor] = React.useState('black');
      const [avatarBgColor, setAvatarBgColor] = React.useState('b6e3f4');

      const [imageSrc, setImageSrc] = React.useState(null);
      const [zoom, setZoom] = React.useState(1);
      const [pan, setPan] = React.useState({ x: 0, y: 0 });
      const [isDragging, setIsDragging] = React.useState(false);
      const [dragStart, setDragStart] = React.useState({ x: 0, y: 0 });
      const [isSaving, setIsSaving] = React.useState(false);
      const [uploadStep, setUploadStep] = React.useState('');
      const canvasRef = React.useRef(null);
      const imgRef = React.useRef(null);

      const adminName = currentUser?.name || CURRENT_SUPER_ADMIN.name || 'SuperAdmin';
      const adminEmail = currentUser?.email || CURRENT_SUPER_ADMIN.email || 'urvashinath0409@gmail.com';

      // Safe DiceBear URL generator adhering strictly to 7.x Avataaars schema
      const expressionParams = expression === 'happy' ? '&mouth=smile,default&eyes=happy,default' : 
                               expression === 'smile' ? '&mouth=smile&eyes=default' :
                               expression === 'serious' ? '&mouth=serious,default&eyes=default' : 
                               expression === 'surprised' ? '&mouth=twinkle&eyes=surprised' : '&mouth=default&eyes=default';
      const genderParams = gender === 'male' ? '&facialHairProbability=100' : '&facialHairProbability=0';
      const accessoriesParams = accessories ? `&accessoriesProbability=100&accessories=${accessories}` : '&accessoriesProbability=0';
      const clothingColorParam = clothingColor ? `&clothingColor=${clothingColor}` : '';

      const previewAvatarUrl = `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(adminName)}&top=${hair}&hairColor=${hairColor}&skinColor=${skinColor}&clothing=${clothing}${clothingColorParam}${gender === 'male' && facialHair ? `&facialHair=${facialHair}&facialHairColor=${facialHairColor}` : ''}${genderParams}${accessoriesParams}${expressionParams}&backgroundColor=${avatarBgColor}`;

      const drawCanvas = () => {
        if (!canvasRef.current || !imgRef.current) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const img = imgRef.current;
        const size = 300;
        canvas.width = size;
        canvas.height = size;
        ctx.clearRect(0, 0, size, size);

        ctx.save();
        ctx.beginPath();
        ctx.arc(size / 2, size / 2, size / 2 - 4, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();

        const aspect = img.width / img.height;
        let drawW, drawH;
        if (aspect > 1) {
          drawH = size * zoom;
          drawW = size * aspect * zoom;
        } else {
          drawW = size * zoom;
          drawH = (size / aspect) * zoom;
        }
        const drawX = (size - drawW) / 2 + pan.x;
        const drawY = (size - drawH) / 2 + pan.y;
        ctx.drawImage(img, drawX, drawY, drawW, drawH);
        ctx.restore();

        ctx.beginPath();
        ctx.arc(size / 2, size / 2, size / 2 - 4, 0, Math.PI * 2);
        ctx.strokeStyle = '#00F0FF';
        ctx.lineWidth = 3;
        ctx.stroke();
      };

      React.useEffect(() => {
        if (!imageSrc) {
          imgRef.current = null;
          return;
        }
        if (!imgRef.current || imgRef.current.src !== imageSrc) {
          const img = new Image();
          img.onload = () => {
            imgRef.current = img;
            drawCanvas();
          };
          img.src = imageSrc;
        } else {
          drawCanvas();
        }
      }, [imageSrc, zoom, pan]);

      const handleFileChange = (e) => {
        if (e.target.files && e.target.files.length > 0) {
          const file = e.target.files[0];
          if (file.size > 15 * 1024 * 1024) {
            alert('Please select an image smaller than 15MB.');
            return;
          }
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              imgRef.current = img;
              setImageSrc(event.target.result);
              setZoom(1);
              setPan({ x: 0, y: 0 });
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        }
      };

      // Save handler for Illustrated Avatar
      const handleSaveAvatar = async () => {
        setIsSaving(true);
        setUploadStep('Syncing avatar with database...');
        try {
          // Persist to Supabase profiles
          await fetch(`${SUPABASE_CONFIG.url}/rest/v1/profiles?email=eq.${encodeURIComponent(adminEmail)}`, {
            method: 'PATCH',
            headers: {
              'apikey': SUPABASE_CONFIG.key,
              'Authorization': `Bearer ${SUPABASE_CONFIG.key}`,
              'Content-Type': 'application/json',
              'Prefer': 'return=minimal'
            },
            body: JSON.stringify({ avatar_url: previewAvatarUrl })
          });

          // Update local storage across all portal keys
          const updatedUser = { ...(currentUser || {}), avatar_url: previewAvatarUrl, avatar: previewAvatarUrl };
          localStorage.setItem('edtech_user', JSON.stringify(updatedUser));
          localStorage.setItem('portal_avatar', previewAvatarUrl);
          localStorage.setItem('admin_portal_avatar', previewAvatarUrl);
          localStorage.setItem('student_portal_avatar', previewAvatarUrl);
          if (setCurrentUser) setCurrentUser(updatedUser);

          if (typeof BroadcastChannel !== 'undefined') {
            try {
              const bc = new BroadcastChannel('edtech_platform_sync');
              bc.postMessage({ type: 'AVATAR_UPDATE', avatar_url: previewAvatarUrl, name: adminName });
              bc.close();
            } catch (bcErr) {}
          }

          window.dispatchEvent(new Event('storage'));
          onClose();
        } catch(err) {
          console.error('Error updating superadmin avatar:', err);
          alert('Failed to save avatar. Please try again.');
        } finally {
          setIsSaving(false);
          setUploadStep('');
        }
      };

      // 📸 Save handler for Photo Upload: 1000x1000 JPG Compression + Cloudflare R2 Upload + Supabase DB Sync
      const handleSaveCrop = async () => {
        if (!imgRef.current) return;
        setIsSaving(true);
        setUploadStep('⚡ Compressing to 1000x1000 JPG master file...');

        try {
          // 1. Create an exact 1000x1000 high-res offscreen canvas
          const masterCanvas = document.createElement('canvas');
          masterCanvas.width = 1000;
          masterCanvas.height = 1000;
          const ctx = masterCanvas.getContext('2d');

          // High-grade bicubic smoothing
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';

          const img = imgRef.current;
          const size = 1000;
          const scaleRatio = 1000 / 300; // ratio from 300px preview canvas to 1000px master

          const aspect = img.width / img.height;
          let drawW, drawH;
          if (aspect > 1) {
            drawH = size * zoom;
            drawW = size * aspect * zoom;
          } else {
            drawW = size * zoom;
            drawH = (size / aspect) * zoom;
          }

          const drawX = (size - drawW) / 2 + (pan.x * scaleRatio);
          const drawY = (size - drawH) / 2 + (pan.y * scaleRatio);

          // Fill clean neutral background then draw image
          ctx.fillStyle = '#060a14';
          ctx.fillRect(0, 0, size, size);
          ctx.drawImage(img, drawX, drawY, drawW, drawH);

          // Convert to 1000x1000 JPEG (quality 0.90)
          const dataUrl = masterCanvas.toDataURL('image/jpeg', 0.90);
          const base64Data = dataUrl.split(',')[1];

          setUploadStep('☁️ Uploading 1000x1000 JPG to Cloudflare R2...');

          let finalUrl = null;

          // 2. Upload to Cloudflare R2 via /api/upload-r2
          try {
            const res = await fetch('/api/upload-r2', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                category: 'avatars',
                isAvatar: true,
                userEmail: adminEmail,
                filename: `profile_1000x1000.jpg`,
                base64Content: base64Data,
                contentType: 'image/jpeg'
              })
            });

            const r2Result = await res.json();
            if (r2Result.ok && r2Result.cdnUrl) {
              finalUrl = r2Result.cdnUrl;
            }
          } catch (r2Err) {
            console.warn('R2 local endpoint error, falling back to Supabase storage:', r2Err);
          }

          // 3. Fallback to Supabase Storage if R2 direct endpoint is unreachable
          if (!finalUrl) {
            try {
              const resBlob = await fetch(dataUrl);
              const blob = await resBlob.blob();
              const fileName = `avatar-${Date.now()}-${Math.random().toString(36).substring(7)}.jpg`;

              const upRes = await fetch(`${SUPABASE_CONFIG.url}/storage/v1/object/avatars/${fileName}`, {
                method: 'POST',
                headers: {
                  'apikey': SUPABASE_CONFIG.key,
                  'Authorization': `Bearer ${SUPABASE_CONFIG.key}`,
                  'Content-Type': 'image/jpeg'
                },
                body: blob
              });

              if (upRes.ok) {
                finalUrl = `${SUPABASE_CONFIG.url}/storage/v1/object/public/avatars/${fileName}`;
              }
            } catch(sbErr) {
              console.warn('Supabase storage fallback error:', sbErr);
            }
          }

          if (!finalUrl) {
            finalUrl = dataUrl;
          }

          setUploadStep('🟢 Syncing Supabase Profile database...');

          // 4. Persist to Supabase profiles table
          await fetch(`${SUPABASE_CONFIG.url}/rest/v1/profiles?email=eq.${encodeURIComponent(adminEmail)}`, {
            method: 'PATCH',
            headers: {
              'apikey': SUPABASE_CONFIG.key,
              'Authorization': `Bearer ${SUPABASE_CONFIG.key}`,
              'Content-Type': 'application/json',
              'Prefer': 'return=minimal'
            },
            body: JSON.stringify({ avatar_url: finalUrl })
          });

          // 5. Update local storage across all portals
          const updatedUser = { ...(currentUser || {}), avatar_url: finalUrl, avatar: finalUrl };
          localStorage.setItem('edtech_user', JSON.stringify(updatedUser));
          localStorage.setItem('portal_avatar', finalUrl);
          localStorage.setItem('admin_portal_avatar', finalUrl);
          localStorage.setItem('student_portal_avatar', finalUrl);
          localStorage.setItem('teacher_portal_avatar', finalUrl);
          if (setCurrentUser) setCurrentUser(updatedUser);

          if (typeof BroadcastChannel !== 'undefined') {
            try {
              const bc = new BroadcastChannel('edtech_platform_sync');
              bc.postMessage({ type: 'AVATAR_UPDATE', avatar_url: finalUrl, name: adminName });
              bc.close();
            } catch (bcErr) {}
          }

          window.dispatchEvent(new Event('storage'));
          onClose();
        } catch(err) {
          console.error('Error uploading 1000x1000 photo:', err);
          alert('Failed to upload photo. Please try again.');
        } finally {
          setIsSaving(false);
          setUploadStep('');
        }
      };

      const selectClass = "w-full bg-slate-900 border border-cyan-500/30 rounded-lg px-2.5 py-1.5 text-xs text-white outline-none";

      return (
        <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
          <div className="glass-panel rounded-2xl max-w-xl w-full p-6 border border-cyan-500/40 space-y-4 max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center border-b border-slate-800 pb-3">
              <div>
                <h3 className="text-lg font-bold text-white flex items-center gap-2">
                  <i className="ph ph-user-circle text-cyan-400 text-xl"></i> SuperAdmin Profile Photo
                </h3>
                <p className="text-xs text-slate-400 mt-0.5">Customize your illustrated avatar or upload a custom 1000x1000 photo to Cloudflare R2.</p>
              </div>
              <button type="button" onClick={onClose} className="text-slate-400 hover:text-white"><i className="ph ph-x text-xl"></i></button>
            </div>

            {/* Tabs */}
            <div className="flex gap-2">
              <button 
                type="button" 
                onClick={() => setActiveTab('avatar')} 
                className={`flex-1 py-2 rounded-xl font-bold text-xs flex items-center justify-center gap-2 border transition-all ${activeTab === 'avatar' ? 'bg-cyan-500/20 border-cyan-400 text-cyan-300' : 'border-slate-800 text-slate-400'}`}
              >
                <i className="ph ph-magic-wand"></i> Avatar Creator
              </button>
              <button 
                type="button" 
                onClick={() => setActiveTab('upload')} 
                className={`flex-1 py-2 rounded-xl font-bold text-xs flex items-center justify-center gap-2 border transition-all ${activeTab === 'upload' ? 'bg-purple-500/20 border-purple-400 text-purple-300' : 'border-slate-800 text-slate-400'}`}
              >
                <i className="ph ph-image"></i> Upload Photo (Cloudflare R2)
              </button>
            </div>

            {activeTab === 'avatar' ? (
              <div className="flex flex-col sm:flex-row gap-5 items-start">
                <div className="flex flex-col items-center gap-3 w-full sm:w-40 flex-shrink-0">
                  <div className="w-28 h-28 rounded-full overflow-hidden border-2 border-cyan-400 shadow-lg shadow-cyan-500/30 bg-white">
                    <img src={previewAvatarUrl} alt="Preview" className="w-full h-full object-cover" />
                  </div>
                  
                  {/* Gender switch */}
                  <div className="flex bg-slate-900 p-1 rounded-full border border-slate-800 w-full">
                    <button 
                      type="button" 
                      onClick={() => { setGender('male'); setHair('shortFlat'); setFacialHair(''); }}
                      className={`flex-1 py-1 rounded-full text-[11px] font-bold ${gender === 'male' ? 'bg-cyan-500 text-black' : 'text-slate-400'}`}
                    >
                      Male
                    </button>
                    <button 
                      type="button" 
                      onClick={() => { setGender('female'); setHair('longButNotTooLong'); setFacialHair(''); }}
                      className={`flex-1 py-1 rounded-full text-[11px] font-bold ${gender === 'female' ? 'bg-purple-500 text-white' : 'text-slate-400'}`}
                    >
                      Female
                    </button>
                  </div>

                  <button 
                    type="button" 
                    onClick={handleSaveAvatar} 
                    disabled={isSaving}
                    className="w-full py-2 rounded-xl font-bold text-black text-xs shadow-lg shadow-cyan-500/30"
                    style={{ background: 'linear-gradient(135deg, #00F0FF, #3B82F6)' }}
                  >
                    {isSaving ? 'Saving...' : 'Apply Avatar'}
                  </button>
                </div>

                {/* Grid of selectors */}
                <div className="grid grid-cols-2 gap-3 flex-1 w-full text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1 font-medium text-[11px]">Expression</label>
                    <select value={expression} onChange={(e) => setExpression(e.target.value)} className={selectClass}>
                      <option value="happy">Happy</option>
                      <option value="smile">Soft Smile</option>
                      <option value="serious">Serious</option>
                      <option value="surprised">Surprised</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1 font-medium text-[11px]">Hair Style</label>
                    <select value={hair} onChange={(e) => setHair(e.target.value)} className={selectClass}>
                      {gender === 'male' ? (
                        <>
                          <option value="shortFlat">Short Flat</option>
                          <option value="shortWaved">Short Waved</option>
                          <option value="shortFrizzle">Short Frizzle</option>
                          <option value="shortDreads01">Short Dreads</option>
                          <option value="frizzle">Frizzle</option>
                          <option value="noHair">Bald</option>
                          <option value="turban">Turban</option>
                        </>
                      ) : (
                        <>
                          <option value="longButNotTooLong">Long</option>
                          <option value="curly">Curly</option>
                          <option value="straight02">Straight</option>
                          <option value="miaWallace">Bob Cut</option>
                          <option value="hijab">Hijab</option>
                        </>
                      )}
                    </select>
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1 font-medium text-[11px]">Hair Color</label>
                    <select value={hairColor} onChange={(e) => setHairColor(e.target.value)} className={selectClass}>
                      <option value="2c1b18">Black</option>
                      <option value="724133">Brown</option>
                      <option value="b58143">Blonde</option>
                      <option value="c93305">Red</option>
                      <option value="e8e1e1">Silver / Gray</option>
                      <option value="f59797">Pink</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1 font-medium text-[11px]">Skin Tone</label>
                    <select value={skinColor} onChange={(e) => setSkinColor(e.target.value)} className={selectClass}>
                      <option value="ffdbb4">Light</option>
                      <option value="f8d25c">Yellow</option>
                      <option value="edb98a">Tanned</option>
                      <option value="d08b5b">Brown</option>
                      <option value="ae5d29">Dark Brown</option>
                      <option value="614335">Black</option>
                    </select>
                  </div>

                  {gender === 'male' && (
                    <>
                      <div>
                        <label className="block text-slate-400 mb-1 font-medium text-[11px]">Facial Hair</label>
                        <select value={facialHair} onChange={(e) => setFacialHair(e.target.value)} className={selectClass}>
                          <option value="">None</option>
                          <option value="beardMedium">Medium Beard</option>
                          <option value="beardLight">Light Beard</option>
                          <option value="beardMajestic">Majestic Beard</option>
                          <option value="moustacheMagnum">Mustache</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-slate-400 mb-1 font-medium text-[11px]">Beard Color</label>
                        <select value={facialHairColor} onChange={(e) => setFacialHairColor(e.target.value)} className={selectClass}>
                          <option value="2c1b18">Black</option>
                          <option value="724133">Brown</option>
                          <option value="b58143">Blonde</option>
                          <option value="c93305">Red</option>
                          <option value="e8e1e1">Silver / Gray</option>
                        </select>
                      </div>
                    </>

      const [r2Stats, setR2Stats] = useState({ usedMB: '14.20', totalFiles: 1, loading: true });

        async function fetchLiveR2Usage() {
          try {
            const res = await fetch(`${SUPABASE_CONFIG.url}/rest/v1/messages?select=media_url`, {
              headers: { 'apikey': SUPABASE_CONFIG.key, 'Authorization': `Bearer ${SUPABASE_CONFIG.key}` }
            });
            const data = await res.json();
            let extraBytes = 0;
            let r2FilesCount = 0;
            if (Array.isArray(data)) {
              const r2Files = data.filter(m => m && m.media_url && typeof m.media_url === 'string' && m.media_url.includes('r2.dev'));
              r2FilesCount = r2Files.length;
              extraBytes = r2FilesCount * 280 * 1024;
            }
            const estBytes = (14.2 * 1024 * 1024) + extraBytes;
            const usedMB = (estBytes / (1024 * 1024)).toFixed(2);
            setR2Stats({
              usedMB: usedMB,
              totalFiles: r2FilesCount + 1,
              loading: false
            });

            setR2Stats(s => ({ ...s, loading: false }));

        const matchesCategory = categoryFilter === 'ALL' || log.category === categoryFilter;

          (log.title || '').toLowerCase().includes(filterTerm.toLowerCase()) ||
          (log.details || '').toLowerCase().includes(filterTerm.toLowerCase()) ||
          (log.actor_email || '').toLowerCase().includes(filterTerm.toLowerCase()) ||
          (log.source || '').toLowerCase().includes(filterTerm.toLowerCase());
        return matchesCategory && matchesSearch;

          const loadedChaps = Array.isArray(dChap) ? dChap : [];

          // Compute progress for each subject
          const subjectPercents = {};
          loadedSubjects.forEach(s => {
            const chaps = loadedChaps.filter(c => c.subject_id === s.id);
            if (chaps.length === 0) {
              subjectPercents[s.id] = 0;
            } else {
              const sum = chaps.reduce((acc, c) => acc + calcChapterProgressScore(c), 0);
              subjectPercents[s.id] = Math.round(sum / chaps.length);

          });

          // Compute progress for each class

            const sumSubj = subs.reduce((acc, s) => acc + (subjectPercents[s.id] || 0), 0);

      const handleFolderSelect = async (e) => {
        const files = Array.from(e.target.files || []);

        setBulkUploadLogs([]);
        const chaptersMap = {};
        let rootSubjectName = '';

        for (const file of files) {
          const path = file.webkitRelativePath || file.name;
          const parts = path.split(/[/\\]/);
          if (parts.length < 2) continue;

          if (!rootSubjectName && parts.length >= 3) {
            rootSubjectName = parts[0];
          }

          let chapterFolder = '';
          let modFolder = '';

          if (parts.length >= 4) {
            chapterFolder = parts[1];
            modFolder = parts[2].toLowerCase();
          } else if (parts.length === 3) {
            chapterFolder = parts[0];
            modFolder = parts[1].toLowerCase();
          } else continue;

          if (!chapterFolder || !modFolder) continue;

          let slug = '';
          if (modFolder.includes('front') || modFolder.includes('visual') || modFolder.includes('hero') || modFolder.includes('scene')) slug = 'front_visuals';
          else if (modFolder.includes('experience') || modFolder.includes('simulation') || modFolder.includes('3d')) slug = 'experience';
          else if (modFolder.includes('experiment') || modFolder.includes('lab')) slug = 'experiments';
          else if (modFolder.includes('quiz') || modFolder.includes('test') || modFolder.includes('exam')) slug = 'quiz';
          else if (modFolder.includes('mixed') || modFolder.includes('mr') || modFolder.includes('vr') || modFolder.includes('ar')) slug = 'mixed_reality';
          else if (modFolder.includes('stori') || modFolder.includes('video') || modFolder.includes('lesson')) slug = 'stories';

          if (!slug) continue;

          if (!chaptersMap[chapterFolder]) {
            const cleanTitle = chapterFolder.replace(/_/g, ' ').replace(/^ch(apter)?\s*/i, '').trim().toUpperCase();
            chaptersMap[chapterFolder] = {
              folderName: chapterFolder,
              title: cleanTitle || chapterFolder.toUpperCase(),

              front_description: '',
              experience: null,
              experiments: [],
              quiz: null,
              mixed_reality: null,
              stories: []
            };
          }

          const chObj = chaptersMap[chapterFolder];

          if (slug === 'front_visuals') {
            if (file.name.endsWith('.txt') || file.name.endsWith('.md')) {
              try {
                const txt = await file.text();
                chObj.front_description = txt.trim();

            } else {
              chObj.front_visuals = file;

          } else if (slug === 'experience' || slug === 'quiz' || slug === 'mixed_reality') {
            if (!chObj[slug]) chObj[slug] = file;
          } else if (slug === 'experiments') {
            chObj.experiments.push(file);
          } else if (slug === 'stories') {
            chObj.stories.push(file);
          }

        const chaptersList = Object.values(chaptersMap);

          subjectName: rootSubjectName || selectedSubject?.name || 'Uploaded Subject',

            const subjName = parsedSubjectFolder.subjectName.replace(/_/g, ' ');
            setBulkUploadLogs(prev => [...prev, `🔍 Looking up subject "${subjName}"...`]);

            const r = await sb(`subjects?select=*&class_id=eq.${selectedClass.id}&name=ilike.${encodeURIComponent(subjName)}`);
            const existing = await r.json();
            if (Array.isArray(existing) && existing.length > 0) {
              targetSubject = existing[0];
              setBulkUploadLogs(prev => [...prev, `✓ Found subject "${targetSubject.name}"`]);
            } else {
              setBulkUploadLogs(prev => [...prev, `✚ Creating new subject "${subjName}"...`]);
              const rNew = await sb('subjects', { method: 'POST', body: JSON.stringify({ class_id: selectedClass.id, name: subjName, icon: '📚', description: 'Bulk Uploaded Subject' }) });
              const dNew = await rNew.json();
              if (Array.isArray(dNew) && dNew.length > 0) {
                targetSubject = dNew[0];
                setBulkUploadLogs(prev => [...prev, `✓ Created subject "${targetSubject.name}"`]);
              }
            }
          }

          if (!targetSubject) {
            setBulkUploadLogs(prev => [...prev, `❌ Error: Please select a Class & Subject first!`]);
            setIsBulkUploading(false);
            return;
          }

          const rChap = await sb(`course_chapters?select=*&subject_id=eq.${targetSubject.id}`);
          const existingChapters = await rChap.json();
          const existingMap = Array.isArray(existingChapters) ? existingChapters : [];

          let count = 0;
          for (const ch of parsedSubjectFolder.chapters) {
            count++;
            setBulkUploadLogs(prev => [...prev, `\n[${count}/${parsedSubjectFolder.chapters.length}] Processing Chapter: "${ch.title}"...`]);

            let chapterRecord = existingMap.find(ex => ex.title.toUpperCase() === ch.title.toUpperCase() || ex.chapter_slug === ch.folderName.toLowerCase());

            if (!chapterRecord) {
              setBulkUploadLogs(prev => [...prev, `  ✚ Creating chapter "${ch.title}" in Supabase...`]);
              const slug = ch.folderName.toLowerCase().replace(/[^a-z0-9]+/g, '-');
              const payload = {
                subject_id: targetSubject.id,
                chapter_order: count,
                chapter_slug: slug,
                title: ch.title,
                description: `Auto-created chapter for ${ch.title}`,
                is_published: true,
                experiments_list: [],
                stories_list: []
              };
              const rPost = await sb('course_chapters', { method: 'POST', body: JSON.stringify(payload) });
              const dPost = await rPost.json();
              if (Array.isArray(dPost) && dPost.length > 0) {
                chapterRecord = dPost[0];
                setBulkUploadLogs(prev => [...prev, `  ✓ Chapter created successfully`]);
              }
            } else {
              setBulkUploadLogs(prev => [...prev, `  ✓ Chapter found in database`]);
            }

            if (!chapterRecord) continue;

            const updates = {};

            // 0. Front Visuals & Description
            if (ch.front_visuals || ch.front_description) {
              if (ch.front_visuals) {
                const fUrl = await helperUploadFileOrReadUrl(ch.front_visuals);
                updates.front_visuals_url = fUrl;
                updates.scene_3d_model_url = fUrl;
                updates.front_visuals_ready = true;
              }
              if (ch.front_description) {
                updates.description = ch.front_description;
              }
              setBulkUploadLogs(prev => [...prev, `  ✓ Linked Front Visuals 3D Scene & Description`]);
            }

            // 1. Experience
            if (ch.experience) {
              const expUrl = await helperUploadFileOrReadUrl(ch.experience);
              updates.experience_url = expUrl;
              updates.experience_ready = true;
              setBulkUploadLogs(prev => [...prev, `  ✓ Linked Experience App`]);
            }

            // 2. Experiments (Multi-item)
            if (ch.experiments && ch.experiments.length > 0) {
              const expList = [];
              let expIdx = 1;
              for (const fileItem of ch.experiments) {
                const itemUrl = await helperUploadFileOrReadUrl(fileItem);
                const labTitle = fileItem.name.replace(/\.[^/.]+$/, '').replace(/_/g, ' ').toUpperCase();
                expList.push({
                  id: `exp_${Date.now()}_${expIdx}`,
                  title: labTitle || `Virtual Lab ${expIdx}`,
                  author: 'by Platform',
                  badge: 'Virtual Lab',
                  likes: '10k',
                  icon: '🧪',
                  gradient: 'linear-gradient(135deg, #00F0FF, #0070F3)',
                  color: '#00F0FF',
                  url: itemUrl
                });
                expIdx++;
              }
              updates.experiments_list = expList;
              updates.experiments_url = expList[0]?.url || '';
              updates.experiments_ready = expList.length > 0;
              setBulkUploadLogs(prev => [...prev, `  ✓ Linked ${expList.length} Lab Experiments`]);
            }

            // 3. Quiz
            if (ch.quiz) {
              const quizUrl = await helperUploadFileOrReadUrl(ch.quiz);
              updates.quiz_url = quizUrl;
              updates.quiz_ready = true;
              setBulkUploadLogs(prev => [...prev, `  ✓ Linked Assessment Quiz`]);
            }

            // 4. Mixed Reality
            if (ch.mixed_reality) {
              const mrUrl = await helperUploadFileOrReadUrl(ch.mixed_reality);
              updates.mixed_reality_url = mrUrl;
              updates.mixed_reality_ready = true;
              setBulkUploadLogs(prev => [...prev, `  ✓ Linked Mixed Reality Scene`]);
            }

            // 5. Stories (Multi-item)
            if (ch.stories && ch.stories.length > 0) {
              const storiesList = [];
              let stIdx = 1;
              for (const fileItem of ch.stories) {
                const itemUrl = await helperUploadFileOrReadUrl(fileItem);
                const storyTitle = fileItem.name.replace(/\.[^/.]+$/, '').replace(/_/g, ' ').toUpperCase();
                storiesList.push({
                  id: `story_${Date.now()}_${stIdx}`,
                  title: storyTitle || `Video Lesson ${stIdx}`,
                  tag: 'LESSON',
                  duration: '5:00',
                  description: 'Chapter video lesson',
                  thumbnail_url: '',
                  url: itemUrl
                });
                stIdx++;
              }
              updates.stories_list = storiesList;
              updates.stories_url = storiesList[0]?.url || '';
              updates.stories_ready = storiesList.length > 0;
              setBulkUploadLogs(prev => [...prev, `  ✓ Linked ${storiesList.length} Story Videos`]);
            }

            await sb(`course_chapters?id=eq.${chapterRecord.id}`, { method: 'PATCH', body: JSON.stringify(updates) });
            setBulkUploadLogs(prev => [...prev, `  🎉 Chapter "${ch.title}" synced & updated!`]);
          }

          setBulkUploadLogs(prev => [...prev, `\n✅ ALL CHAPTERS & CONTENT SUCCESSFULLY IMPORTED!`]);
          showToast('🎉 Bulk Folder Upload & Sync Complete!');
          if (targetSubject) {
            setSelectedSubject(targetSubject);
            loadChapters(targetSubject);
          }
          loadClasses();
        } catch (err) {
          setBulkUploadLogs(prev => [...prev, `❌ Error: ${err.message}`]);
        }
        setIsBulkUploading(false);
      };

      const resolvePreviewUrl = (rawUrl) => {
        if (!rawUrl) return '';
        let clean = rawUrl.trim();
        if (clean.includes('youtube.com/watch')) {
          const v = clean.split('v=')[1]?.split('&')[0];
          if (v) return `https://www.youtube.com/embed/${v}?autoplay=1`;
        } else if (clean.includes('youtu.be/')) {
          const v = clean.split('youtu.be/')[1]?.split('?')[0];
          if (v) return `https://www.youtube.com/embed/${v}?autoplay=1`;
        }
        if (!clean.startsWith('http://') && !clean.startsWith('https://') && !clean.startsWith('/')) {
          return `/study-island/${clean}`;
        }
        return clean;
      };

      // ── MULTI-ITEM MODALITY SLOT (Experiments & Stories) ──
      const MultiItemModalitySlot = ({ chapter, mod }) => {
        const items = Array.isArray(chapterModalities[chapter.id]?.[mod.slug]) ? chapterModalities[chapter.id][mod.slug] : [];
        const isExperiments = mod.slug === 'experiments';
        const [isExpanded, setIsExpanded] = React.useState(true);

        const deleteItem = (idx) => {
          if (!window.confirm(`Remove "${items[idx]?.title || 'item'}"?`)) return;
          const updated = items.filter((_, i) => i !== idx);
          saveMultiItemList(chapter, mod.slug, updated);
        };

        return (
          <div className="rounded-xl p-3.5 space-y-3 transition-all" style={{ border: `1px solid ${mod.color}40`, background: `${mod.color}0a` }}>
            {/* Header */}
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <span className="text-xl">{mod.emoji}</span>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-bold text-white">{mod.label}</span>
                    <span className="text-[10px] px-2 py-0.5 rounded font-mono font-bold" style={{background: `${mod.color}25`, color: mod.color, border: `1px solid ${mod.color}50`}}>
                      {items.length} {isExperiments ? (items.length===1?'Experiment':'Experiments') : (items.length===1?'Story / Video':'Stories / Videos')}
                    </span>
                  </div>
                  <p className="text-[10px] text-slate-400 mt-0.5">{mod.description}</p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => setActiveMultiModal({ chapter, mod, isNew: true, itemData: isExperiments ? { title:'', author:'by Platform', badge:'Latest!', likes:'10k', icon:'🧪', color:'#00E5FF', url:'' } : { title:'', tag:'DOCUMENTARY', duration:'5:00', description:'', thumbnail_url:'', url:'' } })}
                  className="px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 shadow transition"
                  style={{background: `${mod.color}25`, border: `1px solid ${mod.color}60`, color: mod.color}}>
                  <i className="ph ph-plus-circle text-sm"></i> Add {isExperiments ? 'Experiment' : 'Story'}
                </button>
                <button onClick={() => setIsExpanded(!isExpanded)} className="px-2 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 text-xs">
                  {isExpanded ? '▲' : '▼'}
                </button>
              </div>
            </div>

            {/* List of Items */}
            {isExpanded && (
              <div className="space-y-2 pt-1 border-t border-slate-700/40">
                {items.length === 0 ? (
                  <div className="p-4 text-center rounded-lg border border-dashed border-slate-700 bg-slate-900/40">
                    <p className="text-xs text-slate-400">No {isExperiments ? 'experiments' : 'stories'} added yet.</p>
                    <button
                      onClick={() => setActiveMultiModal({ chapter, mod, isNew: true, itemData: isExperiments ? { title:'New Lab', author:'by Platform', badge:'Ready', likes:'5k', icon:'🧪', color:'#00E5FF', url:'' } : { title:'New Story', tag:'DOCUMENTARY', duration:'4:00', description:'', thumbnail_url:'', url:'' } })}
                      className="mt-2 text-[11px] font-bold text-cyan-400 hover:underline">
                      + Click to Add First {isExperiments ? 'Experiment' : 'Story'}
                    </button>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                    {items.map((item, idx) => {
                      const finalUrl = resolvePreviewUrl(item.url);
                      return (
                        <div key={item.id || idx} className="glass-panel p-3 rounded-xl border border-slate-700/70 bg-slate-900/80 flex flex-col justify-between space-y-2 hover:border-cyan-500/40 transition">
                          <div className="flex items-start justify-between gap-2">
                            <div className="flex items-center gap-2.5 overflow-hidden">
                              {isExperiments ? (
                                <div className="w-10 h-10 rounded-xl flex items-center justify-center text-xl shadow flex-shrink-0" style={{background: item.gradient || `linear-gradient(135deg, ${item.color||'#00E5FF'}, #3B82F6)`}}>
                                  {item.icon || '🧪'}
                                </div>
                              ) : (
                                <div className="w-14 h-10 rounded-lg bg-slate-800 border border-slate-700 overflow-hidden flex items-center justify-center flex-shrink-0 relative">
                                  {item.thumbnail_url ? (
                                    <img src={item.thumbnail_url} alt="" className="w-full h-full object-cover" />
                                  ) : (
                                    <span className="text-lg">🎬</span>
                                  )}
                                  <div className="absolute inset-0 bg-black/30 flex items-center justify-center">
                                    <i className="ph ph-play-fill text-xs text-white"></i>
                                  </div>
                                </div>
                              )}
                              <div className="overflow-hidden">
                                <div className="flex items-center gap-1.5">
                                  <h5 className="text-xs font-bold text-white truncate">{item.title || 'Untitled'}</h5>
                                  <span className="text-[9px] px-1.5 py-0.2 rounded font-bold" style={{background: '#38BDF825', color: '#38BDF8', border: '1px solid #38BDF850'}}>
                                    {isExperiments ? (item.badge || 'Ready') : (item.tag || 'LESSON')}
                                  </span>
                                </div>
                                <p className="text-[10px] text-slate-400 truncate">
                                  {isExperiments ? `${item.author || 'by Platform'} • ♥ ${item.likes || '10k'}` : `⏱ ${item.duration || '5:00'} • ${item.description || 'Video Lesson'}`}
                                </p>
                              </div>
                            </div>

                            <div className="flex items-center gap-1 flex-shrink-0">
                              <button onClick={() => setActiveMultiModal({ chapter, mod, isNew: false, itemIndex: idx, itemData: { ...item } })}
                                className="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] font-bold border border-slate-700">
                                ✏️ Edit
                              </button>
                              <button onClick={() => deleteItem(idx)}
                                className="px-1.5 py-1 rounded bg-red-900/30 hover:bg-red-900/50 text-red-300 text-[10px] border border-red-700/40">
                                🗑️
                              </button>
                            </div>
                          </div>

                          <div className="flex items-center justify-between pt-1 border-t border-slate-800 text-[10px]">
                            <span className="font-mono text-slate-400 truncate max-w-[220px]">{item.url || 'No URL attached'}</span>
                            {item.url && (
                              <a href={finalUrl} target="_blank" rel="noreferrer" className="px-2 py-0.5 rounded font-bold bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 border border-cyan-500/40 flex items-center gap-1 transition">
                                <i className="ph ph-arrow-square-out text-xs"></i> Preview ↗
                              </a>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
          </div>
        );
      };

      // ── SINGLE-ITEM MODALITY SLOT (Front Visuals, Experience, Quiz, Mixed Reality) ──
      const SingleModalitySlot = ({ chapter, mod, isCustom=false }) => {
        const saved = chapterModalities[chapter.id]?.[mod.slug] || (mod.slug === 'front_visuals' ? (chapter.front_visuals_url || chapter.scene_3d_model_url || chapter.modality_urls?.front_visuals) : (chapter[`${mod.slug}_url`] || chapter.modality_urls?.[mod.slug])) || '';
        const [url, setUrl] = React.useState(saved);
        const [editing, setEditing] = React.useState(false);
        const [uploading, setUploading] = React.useState(false);
        const [uploadProgress, setUploadProgress] = React.useState('');
        const [dragOver, setDragOver] = React.useState(false);
        const [desc, setDesc] = React.useState(chapter.description || '');
        const [editingDesc, setEditingDesc] = React.useState(false);
        const [savingDesc, setSavingDesc] = React.useState(false);
        const fileInputRef = React.useRef(null);
        const folderInputRef = React.useRef(null);

        React.useEffect(() => {
          setUrl(saved);
        }, [saved]);

        React.useEffect(() => {
          setDesc(chapter.description || '');
        }, [chapter.description]);

        const saveChapterDescription = async () => {
          setSavingDesc(true);
          try {
            const r = await sb(`course_chapters?id=eq.${chapter.id}`, {
              method: 'PATCH',
              body: JSON.stringify({ description: desc })
            });
            if (r.ok) {
              showToast('✅ Chapter description saved!');
              setEditingDesc(false);
              chapter.description = desc;
              setChapters(prev => prev.map(c => c.id === chapter.id ? { ...c, description: desc } : c));
            } else {
              const err = await r.json();
              showToast(err.message || 'Save failed', 'error');
            }
          } catch(e) {
            showToast('Network error saving description', 'error');
          } finally {
            setSavingDesc(false);
          }
        };

        const uploadFileToR2 = async (file) => {
          if (!file) return;
          setUploading(true);
          setUploadProgress(`Reading ${file.name} (${(file.size / 1024).toFixed(1)} KB)...`);

          try {
            const reader = new FileReader();
            reader.onload = async (e) => {
              const base64Data = e.target.result.split(',')[1];
              setUploadProgress(`Uploading ${file.name} to Cloudflare R2...`);

              let authHeader = `Bearer ${SUPABASE_CONFIG.key}`;
              try {
                for (let i = 0; i < localStorage.length; i++) {
                  const key = localStorage.key(i);
                  if (key && (key.startsWith('sb-') || key.includes('supabase')) && (key.endsWith('-auth-token') || key.endsWith('token'))) {
                    try {
                      const tokenData = JSON.parse(localStorage.getItem(key));
                      if (tokenData && tokenData.access_token) {
                        authHeader = `Bearer ${tokenData.access_token}`;
                        break;
                      }
                    } catch(err){}
                  }
                }
              } catch(e) {}

              try {
                const response = await fetch('/api/upload-r2', {
                  method: 'POST',
                  headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': authHeader
                  },
                  body: JSON.stringify({
                    className: selectedClass.name,
                    subjectName: selectedSubject.name,
                    chapterSlug: chapter.chapter_slug || chapter.title.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
                    modalitySlug: mod.slug,
                    filename: file.name,
                    base64Content: base64Data,
                    contentType: file.type || 'text/html'
                  })
                });

                const result = await response.json();
                if (result.ok && result.cdnUrl) {
                  setUrl(result.cdnUrl);
                  await saveModalityUrl(chapter, mod.slug, result.cdnUrl);
                  showToast(`✅ Uploaded & Linked "${file.name}" in Cloudflare R2!`);
                } else {
                  console.error('R2 upload failed:', result);
                  showToast(`❌ Upload failed: ${result.error || 'Server error'}`, 'error');
                }
              } catch (networkErr) {
                console.error('Network error during R2 upload:', networkErr);
                showToast(`❌ Upload error: ${networkErr.message}`, 'error');
              }
              setUploading(false);
              setUploadProgress('');
            };
            reader.readAsDataURL(file);
          } catch (err) {
            console.error('File read error:', err);
            showToast(`❌ File read error: ${err.message}`, 'error');
            setUploading(false);
            setUploadProgress('');
          }
        };

        const handleDrop = (e) => {
          e.preventDefault();
          setDragOver(false);
          if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
            uploadFileToR2(e.dataTransfer.files[0]);
          }
        };

        const previewFinalUrl = resolvePreviewUrl(saved);

        return (
          <div 
            onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
            onDragLeave={() => setDragOver(false)}
            onDrop={handleDrop}
            className={`transition-all relative rounded-xl p-3.5 ${dragOver ? 'border-2 border-cyan-400 bg-cyan-950/40 shadow-lg shadow-cyan-500/20' : ''}`}
            style={{ border: dragOver ? '2px solid #00F0FF' : `1px solid ${mod.color}33`, background: `${mod.color}08` }}>
            
            <input type="file" ref={fileInputRef} className="hidden" onChange={(e) => { if (e.target.files?.[0]) uploadFileToR2(e.target.files[0]); }} />
            <input type="file" ref={folderInputRef} webkitdirectory="true" directory="true" multiple className="hidden" onChange={(e) => { if (e.target.files?.[0]) uploadFileToR2(e.target.files[0]); }} />

            <div className="flex items-center justify-between mb-2">
              <div className="flex items-center gap-2.5">
                <span className="text-xl">{mod.emoji}</span>
                <div>
                  <div className="flex items-center gap-1.5">
                    <span className="text-xs font-bold text-white">{mod.label}</span>
                    {isCustom && <span className="text-[9px] px-1.5 py-0.2 rounded" style={{background:'#94A3B822', color:'#94A3B8', border:'1px solid #94A3B840'}}>CUSTOM</span>}
                  </div>
                  <p className="text-[10px] text-slate-500 mt-0.5">{mod.description}</p>
                </div>
              </div>
              
              <div className="flex items-center gap-1.5">
                {saved ? (
                  <span className="text-[10px] px-2 py-0.5 rounded-full font-bold flex items-center gap-1" style={{background:'#34D39920', color:'#34D399', border:'1px solid #34D39940'}}>
                    <i className="ph ph-check-circle"></i> ✓ LINKED
                  </span>
                ) : (
                  <span className="text-[10px] px-2 py-0.5 rounded-full font-bold" style={{background:'#F4722820', color:'#F47228', border:'1px solid #F4722840'}}>
                    EMPTY
                  </span>
                )}
              </div>
            </div>

            {uploading && (
              <div className="p-2.5 my-2 rounded-lg bg-cyan-950/70 border border-cyan-500/40 text-xs text-cyan-300 font-mono flex items-center gap-2 animate-pulse">
                <i className="ph ph-spinner animate-spin text-base"></i>
                <span>{uploadProgress}</span>
              </div>
            )}

            {editing ? (
              <div className="space-y-2 mt-2 pt-2 border-t border-slate-700/40">
                <div className="flex gap-2">
                  <input
                    type="text" 
                    placeholder="Paste Cloudflare R2 CDN URL, video link, or simulation link..."
                    value={url} 
                    onChange={e => setUrl(e.target.value)}
                    className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white placeholder-slate-600 outline-none font-mono"
                  />
                  <button 
                    onClick={() => { saveModalityUrl(chapter, mod.slug, url); setEditing(false); }}
                    className="px-3 py-1.5 rounded-lg text-xs font-bold text-white shadow" 
                    style={{background: mod.color + '44', border: `1px solid ${mod.color}88`}}>
                    Save Link
                  </button>
                  <button onClick={() => setEditing(false)} className="px-3 py-1.5 rounded-lg text-xs text-slate-400 bg-slate-800 border border-slate-700">✕</button>
                </div>

                <div className="flex items-center gap-2 pt-1">
                  <button 
                    onClick={() => fileInputRef.current?.click()}
                    className="flex-1 py-2 px-3 rounded-lg border border-dashed border-cyan-500/50 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-300 text-xs font-bold flex items-center justify-center gap-1.5 transition">
                    <i className="ph ph-file-arrow-up text-sm"></i> Upload File to R2
                  </button>
                  <button 
                    onClick={() => folderInputRef.current?.click()}
                    className="py-2 px-3 rounded-lg border border-dashed border-purple-500/50 bg-purple-500/10 hover:bg-purple-500/20 text-purple-300 text-xs font-bold flex items-center justify-center gap-1.5 transition">
                    <i className="ph ph-folder-arrow-up text-sm"></i> Upload Folder / Bundle
                  </button>
                </div>
              </div>
            ) : (
              <div className="flex items-center gap-2 mt-2 pt-1 border-t border-slate-700/20">
                {saved ? (
                  <div className="flex-1 flex items-center gap-2 overflow-hidden">
                    <span className="text-[11px] text-cyan-300 font-mono truncate bg-slate-900/90 px-2.5 py-1 rounded border border-slate-800">{saved}</span>
                    <a 
                      href={previewFinalUrl} 
                      target="_blank" 
                      rel="noreferrer"
                      className="px-2.5 py-1 rounded-lg text-[10px] font-bold bg-cyan-500/20 hover:bg-cyan-500/35 text-cyan-300 border border-cyan-500/40 flex items-center gap-1 transition shadow">
                      <i className="ph ph-arrow-square-out text-xs"></i> Preview ↗
                    </a>
                  </div>
                ) : (
